[project]
name = "proyecto-ia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "therake77", email = "jarema9125@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0"]
cuda = ["cupy-cuda12x>=13.0"]

[project.scripts]
proyecto-ia = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/app",
    "src/tensor",
    "src/backend",
    "src/autograd",
    "src/ops",
    "src/nn",
    "src/optim",
    "src/data",
    "src/testing",
]
